<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Builder - 關卡 3-5</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.8/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./styles.css">
    <link rel="stylesheet" href="./chapter1-level.css">
</head>
<body>
    <div id="app"></div>
    <script>
        window.levelConfig = {
            id: '3-5',
            title: '特定隱藏',
            description: '(RWD) 隱藏手機上複雜的日期選擇器,只在大型桌面 (lg) 尺寸上顯示。',
            hint: '使用 <code>.d-none</code> (預設隱藏) 和 <code>.d-lg-block</code> (大螢幕顯示) 組合。',
            htmlTemplate: `<div class="container">
  <div class="{{input1}} {{input2}}">日期選擇器</div>
  <p>其他內容</p>
</div>`,
            inputs: [
                { placeholder: 'd-none', answer: 'd-none' },
                { placeholder: 'd-lg-block', answer: 'd-lg-block' }
            ],
            preview: '<div class="container"><div class="{{class1}} {{class2}} preview-element">日期選擇器</div><p style="padding: 20px; background: #f8f9fa; border-radius: 5px;">其他內容</p></div>',
            image: './images/no-image.png',
            url: 'https://getbootstrap.com/docs/5.3/utilities/display/',
            pageTitle: 'Display - 顯示控制',
            pageLink: 'https://getbootstrap.com/docs/5.3/utilities/display/#hiding-elements',
            cssRule: `.d-none {
  display: none !important;
}
@media (min-width: 992px) {
  .d-lg-block {
    display: block !important;
  }
}`
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./chapter1-level.js"></script>
</body>
</html>
