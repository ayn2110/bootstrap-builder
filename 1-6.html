<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Builder - 關卡 1-6</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.8/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./styles.css">
    <link rel="stylesheet" href="./chapter1-level.css">
</head>
<body>
    <div id="app"></div>
    <script>
        window.levelConfig = {
            id: '1-6',
            title: '雙欄對等',
            description: '將兩個產品卡片放入 row 中,讓它們平均分配為兩個等寬區塊。直接在 col 上設定背景色，觀察與下一關的差異。',
            hint: '在同一個 row 中使用兩次 <code>.col</code> 類別。',
            htmlTemplate: `<div class="container">
  <div class="row">
    <div class="{{input1}} bg-primary text-white p-3">產品 A</div>
    <div class="{{input1}} bg-primary text-white p-3">產品 B</div>
  </div>
</div>`,
            inputs: [{ placeholder: '', answer: 'col' }],
            preview: '<div class="container"><div class="row"><div class="{{class1}} bg-primary text-white p-3">產品 A</div><div class="{{class1}} bg-primary text-white p-3">產品 B</div></div></div>',
            image: './images/1-6.png',
            url: 'https://www.dintaifung.com.tw/',
            pageTitle: 'Columns - 等寬欄位',
            pageLink: 'https://getbootstrap.com/docs/5.3/layout/columns/#equal-width',
            cssRule: `.col {
  flex: 1 0 0%;
}`
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./chapter1-level.js"></script>
</body>
</html>
