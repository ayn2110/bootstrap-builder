<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Builder - 關卡 6-1</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.8/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./styles.css">
    <link rel="stylesheet" href="./chapter1-level.css">
</head>
<body>
    <div id="app"></div>
    <script>
        window.levelConfig = {
            id: '6-1',
            title: '回到上方按鈕',
            description: '在右下角放置一個回到上方的按鈕。',
            hint: '使用 <code>.position-fixed</code>, <code>.bottom-0</code>, <code>.end-0</code> (Bootstrap 5 使用 end 代表右側)。',
            htmlTemplate: `<div class="container-fluid" style="min-height: 70vh; position: relative; border: 1px solid #ccc; padding: 24px;">
  <p>頁面內容...</p>
  <button class="btn btn-primary {{input1}} {{input2}} {{input3}} m-3">Top</button>
</div>`,
            inputs: [
                { placeholder: 'position-fixed', answer: 'position-fixed' },
                { placeholder: 'bottom-0', answer: 'bottom-0' },
                { placeholder: 'end-0', answer: 'end-0' }
            ],
            preview: '<div class="container-fluid" style="min-height: 70vh; position: relative; border: 1px solid #ccc; padding: 24px;"><p>頁面內容...</p><p>更多內容...</p><p>更多內容...</p><button class="btn btn-primary {{class1}} {{class2}} {{class3}} m-3">Top</button></div>',
            image: './images/no-image.png',
            url: 'https://getbootstrap.com/docs/5.3/utilities/position/',
            pageTitle: 'Position - Utilities',
            pageLink: 'https://getbootstrap.com/docs/5.3/utilities/position/',
            cssRule: `.position-fixed { position: fixed !important; }
.bottom-0 { bottom: 0 !important; }
.end-0 { right: 0 !important; }`
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./chapter1-level.js"></script>
</body>
</html>
