<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Builder - 關卡 5-10</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.8/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./styles.css">
    <link rel="stylesheet" href="./chapter1-level.css">
</head>
<body>
    <div id="app"></div>
    <script>
        window.levelConfig = {
            id: '5-10',
            title: '關閉預設',
            description: '表單驗證步驟 2：添加 novalidate 屬性以關閉瀏覽器預設的驗證氣泡框。',
            hint: '這是一個布林屬性，不需要值。',
            htmlTemplate: `<div class="container">
  <form class="needs-validation" {{input1}}>
    <!-- 表單內容 -->
  </form>
</div>`,
            inputs: [{ placeholder: 'novalidate', answer: 'novalidate' }],
            preview: '<div class="container"><form class="needs-validation" {{class1}} p-3 border rounded">表單內容區域 (已關閉預設驗證)</form></div>',
            image: './images/no-image.png',
            url: 'https://getbootstrap.com/docs/5.3/forms/validation/#custom-styles',
            pageTitle: 'Forms - Validation',
            pageLink: 'https://getbootstrap.com/docs/5.3/forms/validation/#custom-styles',
            cssRule: '/* novalidate disables browser default feedback */'
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./chapter1-level.js"></script>
</body>
</html>
