<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Builder - 關卡 2-5</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.8/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./styles.css">
    <link rel="stylesheet" href="./chapter1-level.css">
</head>
<body>
    <div id="app"></div>
    <script>
        window.levelConfig = {
            id: '2-5',
            title: '垂直對齊',
            description: '將 row 內所有分欄(如圖標和文字)在垂直方向上對齊到中心。',
            hint: '在 <code>.row</code> 上使用 <code>.align-items-center</code> 來垂直居中對齊所有子元素。',
            htmlTemplate: `<div class="container">
  <div class="row {{input1}}" style="min-height: 150px;">
    <div class="col">圖標</div>
    <div class="col">文字說明</div>
  </div>
</div>`,
            inputs: [{ placeholder: 'align-items-center', answer: 'align-items-center' }],
            preview: '<div class="container"><div class="row {{class1}}" style="min-height: 150px; background: #f8f9fa; border-radius: 5px;"><div class="col preview-element">圖標</div><div class="col preview-element">文字說明</div></div></div>',
            image: './images/no-image.png',
            url: 'https://getbootstrap.com/docs/5.3/utilities/flex/',
            pageTitle: 'Flex - 垂直對齊',
            pageLink: 'https://getbootstrap.com/docs/5.3/utilities/flex/#align-items',
            cssRule: `.align-items-center {
  align-items: center !important;
}`
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./chapter1-level.js"></script>
</body>
</html>
