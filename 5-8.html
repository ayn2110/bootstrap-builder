<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Builder - 關卡 5-8</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.8/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./styles.css">
    <link rel="stylesheet" href="./chapter1-level.css">
</head>
<body>
    <div id="app"></div>
    <script>
        window.levelConfig = {
            id: '5-8',
            title: '水平表單',
            description: '利用 Grid System 排列標籤與輸入框，製作水平排列的表單。',
            hint: 'Label 佔 <code>col-2</code>，Input 容器佔 <code>col-10</code>。',
            htmlTemplate: `<div class="container">
  <div class="row mb-3">
    <label for="colFormLabel" class="{{input1}}">Email</label>
    <div class="{{input2}}">
      <input type="email" class="form-control">
    </div>
  </div>
</div>`,
            inputs: [
                { placeholder: 'col-2', answer: 'col-2' },
                { placeholder: 'col-10', answer: 'col-10' }
            ],
            preview: '<div class="container"><div class="row mb-3"><label for="colFormLabel" class="{{class1}} col-form-label">Email</label><div class="{{class2}}"><input type="email" class="form-control" id="colFormLabel" placeholder="col-form-label"></div></div></div>',
            image: './images/no-image.png',
            url: 'https://getbootstrap.com/docs/5.3/forms/layout/#horizontal-form',
            pageTitle: 'Forms - Layout',
            pageLink: 'https://getbootstrap.com/docs/5.3/forms/layout/#horizontal-form',
            cssRule: `.col-form-label {
  padding-top: calc(0.375rem + 1px);
  padding-bottom: calc(0.375rem + 1px);
  margin-bottom: 0;
  font-size: inherit;
  line-height: 1.5;
}`
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./chapter1-level.js"></script>
</body>
</html>
