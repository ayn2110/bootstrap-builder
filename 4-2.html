<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Builder - 關卡 4-2</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.8/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./styles.css">
    <link rel="stylesheet" href="./chapter1-level.css">
</head>
<body>
    <div id="app"></div>
    <script>
        window.levelConfig = {
            id: '4-2',
            title: '背景圖片技術',
            description: '使用 CSS background-image 替代 img 標籤,提供更好的圖片控制和佈局彈性。',
            hint: '使用 <code>background-image</code>、<code>background-size: cover</code> 和 <code>background-position: center</code> 來實現完美的圖片顯示。(此為自定義樣式 非Bootstrap class)',
            htmlTemplate: `<div class="container">
  <div class="row">
    <div class="col-md-4">
      <div class="{{input1}}">
        <div class="overlay-content">
          <h4>產品標題</h4>
          <p>產品描述</p>
        </div>
      </div>
    </div>
  </div>
</div>`,
            inputs: [{ placeholder: 'bg-image-card', answer: 'bg-image-card' }],
            preview: '<div class="container"><div class="row"><div class="col-md-4"><div class="{{class1}}" style="background-image: url(\'https://placedog.net/400/300\'); "><div style="background: linear-gradient(transparent, rgba(0,0,0,0.7)); padding: 20px; border-radius: 0 0 10px 10px; width: 100%;"><h5 style="margin: 0; color: white;">產品標題</h5><p style="margin: 0; color: white; font-size: 0.9em;">產品描述</p></div></div></div></div></div>',
            image: './images/no-image.png',
            url: 'https://developer.mozilla.org/zh-TW/docs/Web/CSS/background-image',
            pageTitle: 'Background Image - 背景圖片技術',
            pageLink: 'https://developer.mozilla.org/zh-TW/docs/Web/CSS/background-image',
            cssRule: `/* CSS Background */
background-image: url(...);
background-size: cover;
background-position: center;`
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./chapter1-level.js"></script>
</body>
</html>
