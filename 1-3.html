<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Builder - 關卡 1-3</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.8/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./styles.css">
    <link rel="stylesheet" href="./chapter1-level.css">
</head>
<body>
    <div id="app"></div>
    <script>
        window.levelConfig = {
            id: '1-3',
            title: '啟動分欄',
            description: '在容器中創建一個新的水平區塊,準備進行內容分欄。',
            hint: '使用 <code>.row</code> 類別來創建一個水平分欄容器。',
            htmlTemplate: `<div class="container">
  <div class="{{input1}}">
    <div class="col">內容區塊</div>
  </div>
</div>`,
            inputs: [{ placeholder: '', answer: 'row' }],
            preview: '<div class="container"><div class="{{class1}}"><div class="col preview-element">內容區塊</div></div></div>',
            image: './images/no-image.png',
            url: 'javascript:void(0)',
            pageTitle: 'Grid System - 網格行',
            pageLink: 'https://getbootstrap.com/docs/5.3/layout/grid/#row-columns',
            cssRule: `.row {
  --bs-gutter-x: 1.5rem;
  --bs-gutter-y: 0;
  display: flex;
  flex-wrap: wrap;
  margin-top: calc(-1 * var(--bs-gutter-y));
  margin-right: calc(-0.5 * var(--bs-gutter-x));
  margin-left: calc(-0.5 * var(--bs-gutter-x));
}`
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./chapter1-level.js"></script>
</body>
</html>
