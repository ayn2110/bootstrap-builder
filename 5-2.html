<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Builder - 關卡 5-2</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.8/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./styles.css">
    <link rel="stylesheet" href="./chapter1-level.css">
</head>
<body>
    <div id="app"></div>
    <script>
        window.levelConfig = {
            id: '5-2',
            title: '標籤關聯',
            description: '使用 for 屬性將 label 與 input 關聯，這對於無障礙訪問（Accessibility）非常重要。',
            hint: '<code>label</code> 的 <code>for</code> 屬性值必須與 <code>input</code> 的 <code>id</code> 屬性值完全一致。',
            htmlTemplate: `<div class="container">
  <form>
    <label for="{{input1}}">電子信箱:</label>
    <input type="email" id="{{input2}}">
  </form>
</div>`,
            inputs: [
                { placeholder: 'user-email', answer: 'user-email' },
                { placeholder: 'user-email', answer: 'user-email' }
            ],
            preview: '<div class="container"><form><label for="{{class1}}">電子信箱:</label> <input type="email" id="{{class2}}"></form></div>',
            image: './images/no-image.png',
            url: 'https://developer.mozilla.org/zh-TW/docs/Web/HTML/Element/label',
            pageTitle: 'HTML Label',
            pageLink: 'https://developer.mozilla.org/zh-TW/docs/Web/HTML/Element/label',
            cssRule: '/* Clicking label focuses input */'
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./chapter1-level.js"></script>
</body>
</html>
