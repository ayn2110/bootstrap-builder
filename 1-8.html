<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Builder - 關卡 1-8</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.8/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./styles.css">
    <link rel="stylesheet" href="./chapter1-level.css">
</head>
<body>
    <div id="app"></div>
    <script>
        window.levelConfig = {
            id: '1-8',
            title: '三欄佈局',
            description: '將三個區塊放入 row 中,平均分成三個等寬區塊。',
            hint: '在同一個 row 中使用三次 <code>.col</code> 類別。',
            htmlTemplate: `<div class="container">
  <div class="row">
    <div class="{{input1}}"><div class="bg-primary text-white p-3">服務 1</div></div>
    <div class="{{input1}}"><div class="bg-primary text-white p-3">服務 2</div></div>
    <div class="{{input1}}"><div class="bg-primary text-white p-3">服務 3</div></div>
  </div>
</div>`,
            inputs: [{ placeholder: '', answer: 'col' }],
            preview: '<div class="container"><div class="row"><div class="{{class1}}"><div class="bg-primary text-white p-3">服務 1</div></div><div class="{{class1}}"><div class="bg-primary text-white p-3">服務 2</div></div><div class="{{class1}}"><div class="bg-primary text-white p-3">服務 3</div></div></div></div>',
            image: './images/1-8.png',
            url: 'https://www.umai.tw/',
            pageTitle: 'Columns - 多欄佈局',
            pageLink: 'https://getbootstrap.com/docs/5.3/layout/columns/#equal-width-multi-row',
            cssRule: `.col {
  flex: 1 0 0%;
}`
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./chapter1-level.js"></script>
</body>
</html>
