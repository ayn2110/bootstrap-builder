<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Builder - 關卡 4-1</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.8/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./styles.css">
    <link rel="stylesheet" href="./chapter1-level.css">
</head>
<body>
    <div id="app"></div>
    <script>
        window.levelConfig = {
            id: '4-1',
            title: '響應式圖片',
            description: '使用 Bootstrap 內建的響應式圖片類別,讓圖片自動適應容器寬度。',
            hint: '使用 <code>.img-fluid</code> 類別讓圖片具備響應式特性,相當於 CSS 的 max-width: 100% 和 height: auto。',
            htmlTemplate: `<div class="container">
  <div class="row">
    <div class="col-md-6">
      <img src="https://via.placeholder.com/600x400/667eea/white?text=產品圖片" class="{{input1}}" alt="產品圖片">
    </div>
    <div class="col-md-6">
      <h3>產品說明</h3>
      <p>這是產品的詳細說明內容...</p>
    </div>
  </div>
</div>`,
            inputs: [{ placeholder: 'img-fluid', answer: 'img-fluid' }],
            preview: '<div class="container"><div class="row"><div class="col-md-6"><img src="https://placedog.net/600/600" class="{{class1}}"  alt="產品圖片"></div><div class="col-md-6 preview-element" style="display: flex; flex-direction: column; justify-content: center;"><h5>產品說明</h5><p style="margin: 0; font-size: 0.9em;">這是產品的詳細說明內容...</p></div></div></div>',
            image: './images/no-image.png',
            url: 'https://getbootstrap.com/docs/5.3/content/images/',
            pageTitle: 'Images - 響應式圖片',
            pageLink: 'https://getbootstrap.com/docs/5.3/content/images/#responsive-images',
            cssRule: `.img-fluid {
  max-width: 100%;
  height: auto;
}`
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./chapter1-level.js"></script>
</body>
</html>
