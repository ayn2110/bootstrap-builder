<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Builder - 關卡 1-5</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.8/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./styles.css">
    <link rel="stylesheet" href="./chapter1-level.css">
</head>
<body>
    <div id="app"></div>
    <script>
        window.levelConfig = {
            id: '1-5',
            title: '通用類別',
            description: '為區塊添加背景顏色，以便更清楚地看到範圍。',
            hint: '使用 <code>bg-white</code> 類別來設置白色背景。',
            htmlTemplate: `<div class="container bg-primary">
  <div class="row">
    <div class="col {{input1}}">內容</div>
  </div>
</div>`,
            inputs: [{ placeholder: '', answer: 'bg-white' }],
            preview: '<div class="container bg-primary p-3"><div class="row"><div class="col {{class1}} p-3">內容</div></div></div>',
            image: './images/1-5.png',
            url: 'https://www.creatures.co.jp/',
            pageTitle: 'Utilities - 背景顏色',
            pageLink: 'https://getbootstrap.com/docs/5.3/utilities/background/',
            cssRule: `.bg-white {
  --bs-bg-opacity: 1;
  background-color: rgba(var(--bs-white-rgb), var(--bs-bg-opacity)) !important;
}`
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./chapter1-level.js"></script>
</body>
</html>
