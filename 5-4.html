<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Builder - 關卡 5-4</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.8/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./styles.css">
    <link rel="stylesheet" href="./chapter1-level.css">
</head>
<body>
    <div id="app"></div>
    <script>
        window.levelConfig = {
            id: '5-4',
            title: '表單樣式',
            description: '套用 Bootstrap 的標準表單樣式，讓表單看起來更專業。',
            hint: '為 label 加上 <code>form-label</code>，為 input 加上 <code>form-control</code>。',
            htmlTemplate: `<div class="container">
  <form>
    <div class="mb-3">
      <label for="exampleInput" class="{{input1}}">Email:</label>
      <input type="email" class="{{input2}}" id="exampleInput">
    </div>
  </form>
</div>`,
            inputs: [
                { placeholder: 'form-label', answer: 'form-label' },
                { placeholder: 'form-control', answer: 'form-control' }
            ],
            preview: '<div class="container"><form><div class="mb-3"><label for="exampleInput" class="{{class1}}">Email address</label><input type="email" class="{{class2}}" id="exampleInput"></div></form></div>',
            image: './images/no-image.png',
            url: 'https://getbootstrap.com/docs/5.3/forms/overview/',
            pageTitle: 'Forms - Overview',
            pageLink: 'https://getbootstrap.com/docs/5.3/forms/overview/',
            cssRule: `.form-control {
  display: block;
  width: 100%;
  padding: 0.375rem 0.75rem;
  font-size: 1rem;
  font-weight: 400;
  line-height: 1.5;
  color: var(--bs-body-color);
  background-color: var(--bs-body-bg);
  background-clip: padding-box;
  border: var(--bs-border-width) solid var(--bs-border-color);
  border-radius: var(--bs-border-radius);
}`
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./chapter1-level.js"></script>
</body>
</html>
