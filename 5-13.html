<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Builder - 關卡 5-13</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.8/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./styles.css">
    <link rel="stylesheet" href="./chapter1-level.css">
</head>
<body>
    <div id="app"></div>
    <script>
        window.levelConfig = {
            id: '5-13',
            title: '錯誤訊息',
            description: '表單驗證步驟 5：添加 .invalid-feedback 區塊，這會在驗證失敗時顯示。',
            hint: '將此 div 放在 input 下方。',
            htmlTemplate: `<div class="container">
  <form class="was-validated">
    <input type="text" class="form-control" required>
    <div class="{{input1}}">
      請輸入內容。
    </div>
  </form>
</div>`,
            inputs: [{ placeholder: 'invalid-feedback', answer: 'invalid-feedback' }],
            preview: '<div class="container"><form class="was-validated"><input type="text" class="form-control is-invalid" required><div class="{{class1}}">請輸入內容。</div></form></div>',
            image: './images/no-image.png',
            url: 'https://getbootstrap.com/docs/5.3/forms/validation/',
            pageTitle: 'Forms - Validation Feedback',
            pageLink: 'https://getbootstrap.com/docs/5.3/forms/validation/',
            cssRule: `.was-validated :invalid ~ .invalid-feedback {
  display: block;
}`
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./chapter1-level.js"></script>
</body>
</html>
