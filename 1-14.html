<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Builder - 關卡 1-14</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.8/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./styles.css">
    <link rel="stylesheet" href="./chapter1-level.css">
</head>
<body>
    <div id="app"></div>
    <script>
        window.levelConfig = {
            id: '1-14',
            title: '若加總超過12',
            description: '當指定寬度的欄位加總超過 12 時，多出的欄位會自動換行。',
            hint: '使用 <code>col-4</code> 和 <code>col-9</code> (4+9=13 > 12)。',
            htmlTemplate: `<div class="container">
  <div class="row">
    <div class="{{input1}}"><div class="bg-primary text-white p-3">區塊 A (4)</div></div>
    <div class="{{input2}}"><div class="bg-primary text-white p-3">區塊 B (9)</div></div>
  </div>
</div>`,
            inputs: [
                { placeholder: '', answer: 'col-4' },
                { placeholder: '', answer: 'col-9' }
            ],
            preview: '<div class="container"><div class="row"><div class="{{class1}}"><div class="bg-primary text-white p-3">區塊 A (4)</div></div><div class="{{class2}}"><div class="bg-primary text-white p-3">區塊 B (9)</div></div></div></div>',
            image: './images/no-image.png',
            url: 'javascript:void(0)',
            pageTitle: 'Grid System - 欄位換行',
            pageLink: 'https://getbootstrap.com/docs/5.3/layout/grid/#column-wrapping',
            cssRule: `.col-4 {
  width: 33.33333333%;
}
.col-9 {
  width: 75%;
}`
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./chapter1-level.js"></script>
</body>
</html>
