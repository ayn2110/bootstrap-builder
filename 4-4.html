<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Builder - 關卡 4-4</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.8/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./styles.css">
    <link rel="stylesheet" href="./chapter1-level.css">
</head>
<body>
    <div id="app"></div>
    <script>
        window.levelConfig = {
            id: '4-4',
            title: '固定比例容器',
            description: '使用 padding-bottom 技術創建固定比例的圖片容器。',
            hint: '使用 <code>padding-bottom</code> 百分比技術來維持固定的寬高比例。(此為自定義樣式 非Bootstrap class)',
            htmlTemplate: `<div class="container">
  <div class="row">
    <div class="col-md-6">
      <div class="{{input1}}" style="{{input2}}">
        <img src="https://via.placeholder.com/600x600/6f42c1/white?text=1:1+Ratio" class="img-fluid" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%;  border-radius: 10px;" alt="16:9 比例圖片">
      </div>
      <p class="mt-2 text-center">16:9 比例</p>
    </div>
  </div>
</div>`,
            inputs: [
                { placeholder: 'ratio-container', answer: 'ratio-container' },
                { placeholder: 'padding-bottom: 56.25%; position: relative;', answer: 'padding-bottom: 56.25%; position: relative;' }
            ],
            preview: '<div class="container"><div class="row"><div class="col-md-6"><div class="{{class1}}" style="{{class2}}"><img src="https://placedog.net/600x600" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; border-radius: 10px;" alt="16:9"></div><p class="text-center mt-2" style="font-size: 0.85em;">16:9 比例</p></div></div></div>',
            image: './images/no-image.png',
            url: 'https://developer.mozilla.org/zh-TW/docs/Web/CSS/padding-bottom',
            pageTitle: 'Padding Bottom - 固定比例技術',
            pageLink: 'https://developer.mozilla.org/zh-TW/docs/Web/CSS/padding-bottom',
            cssRule: `/* CSS Aspect Ratio Hack */
.ratio-container {
  position: relative;
  width: 100%;
}
/* padding-bottom: 56.25% = 9/16 */`
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./chapter1-level.js"></script>
</body>
</html>
