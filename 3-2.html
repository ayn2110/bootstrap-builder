<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Builder - 關卡 3-2</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.8/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./styles.css">
    <link rel="stylesheet" href="./chapter1-level.css">
</head>
<body>
    <div id="app"></div>
    <script>
        window.levelConfig = {
            id: '3-2',
            title: '順序反轉',
            description: '(RWD) 在桌面尺寸下,側邊欄放在右邊;但在手機上,側邊欄必須移到主內容上方。',
            hint: '使用 <code>.order-first</code> (手機優先) 和 <code>.order-md-last</code> (桌面最後) 在側邊欄上。',
            htmlTemplate: `<div class="container">
  <div class="row">
    <div class="col-12 col-md-8">主內容</div>
    <div class="col-12 col-md-4 {{input1}} {{input2}}">側邊欄</div>
  </div>
</div>`,
            inputs: [
                { placeholder: 'order-first', answer: 'order-first' },
                { placeholder: 'order-md-last', answer: 'order-md-last' }
            ],
            preview: '<div class="container"><div class="row"><div class="col-12 col-md-8 preview-element">主內容</div><div class="col-12 col-md-4 {{class1}} {{class2}} preview-element">側邊欄</div></div></div>',
            image: './images/no-image.png',
            url: 'https://getbootstrap.com/docs/5.3/utilities/flex/',
            pageTitle: 'Flex - 元素順序',
            pageLink: 'https://getbootstrap.com/docs/5.3/utilities/flex/#order',
            cssRule: `.order-first {
  order: -1 !important;
}
@media (min-width: 768px) {
  .order-md-last {
    order: 6 !important;
  }
}`
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./chapter1-level.js"></script>
</body>
</html>
