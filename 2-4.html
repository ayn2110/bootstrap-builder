<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Builder - 關卡 2-4</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.8/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./styles.css">
    <link rel="stylesheet" href="./chapter1-level.css">
</head>
<body>
    <div id="app"></div>
    <script>
        window.levelConfig = {
            id: '2-4',
            title: '頂部留白',
            description: '調整標題的上內邊距 (Padding Top) 為級別 5 (最大間距)。',
            hint: '使用 <code>.pt-5</code> 來設置上內邊距為最大級別。',
            htmlTemplate: `<div class="container">
  <h2 class="{{input1}}">網站標題</h2>
  <p>內容文字...</p>
</div>`,
            inputs: [{ placeholder: 'pt-5', answer: 'pt-5' }],
            preview: '<div class="container"><h2 class="{{class1}}" style="background: #e9ecef; padding-left: 20px; padding-right: 20px; border-radius: 5px;">網站標題</h2><p style="padding: 20px; background: #f8f9fa; border-radius: 5px;">內容文字...</p></div>',
            image: './images/no-image.png',
            url: 'https://getbootstrap.com/docs/5.3/utilities/spacing/',
            pageTitle: 'Spacing - 內邊距工具',
            pageLink: 'https://getbootstrap.com/docs/5.3/utilities/spacing/#how-it-works',
            cssRule: `.pt-5 {
  padding-top: 3rem !important;
}`
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./chapter1-level.js"></script>
</body>
</html>
