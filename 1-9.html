<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Builder - 關卡 1-9</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.8/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./styles.css">
    <link rel="stylesheet" href="./chapter1-level.css">
</head>
<body>
    <div id="app"></div>
    <script>
        window.levelConfig = {
            id: '1-9',
            title: '五等份挑戰',
            description: '將五個區塊說明放入 row 中,讓它們等寬並排。',
            hint: '在同一個 row 中使用五次 <code>.col</code> 類別。',
            htmlTemplate: `<div class="container">
  <div class="row">
    <div class="{{input1}}"><div class="bg-primary text-white p-2">步驟1</div></div>
    <div class="{{input1}}"><div class="bg-primary text-white p-2">步驟2</div></div>
    <div class="{{input1}}"><div class="bg-primary text-white p-2">步驟3</div></div>
    <div class="{{input1}}"><div class="bg-primary text-white p-2">步驟4</div></div>
    <div class="{{input1}}"><div class="bg-primary text-white p-2">步驟5</div></div>
  </div>
</div>`,
            inputs: [{ placeholder: '', answer: 'col' }],
            preview: '<div class="container"><div class="row"><div class="{{class1}}"><div class="bg-primary text-white p-2">步驟1</div></div><div class="{{class1}}"><div class="bg-primary text-white p-2">步驟2</div></div><div class="{{class1}}"><div class="bg-primary text-white p-2">步驟3</div></div><div class="{{class1}}"><div class="bg-primary text-white p-2">步驟4</div></div><div class="{{class1}}"><div class="bg-primary text-white p-2">步驟5</div></div></div></div>',
            image: './images/1-9.png',
            url: 'https://tm.ccl.ttct.edu.tw/',
            pageTitle: 'Columns - 多欄等分',
            pageLink: 'https://getbootstrap.com/docs/5.3/layout/columns/#equal-width',
            cssRule: `.col {
  flex: 1 0 0%;
}`
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./chapter1-level.js"></script>
</body>
</html>
