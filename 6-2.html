<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Builder - 關卡 6-2</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.8/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./styles.css">
    <link rel="stylesheet" href="./chapter1-level.css">
</head>
<body>
    <div id="app"></div>
    <script>
        window.levelConfig = {
                        id: '6-2',
                        title: '徽章標記',
                        description: '在按鈕角落放置通知徽章 (Absolute Badge)。',
                        hint: '父元素需有 <code>.position-relative</code>，徽章使用 <code>.position-absolute</code> 配合 <code>.top-0</code> / <code>.start-100</code> / <code>.translate-middle</code>。',
                        htmlTemplate: `<div class="container-fluid text-center" style="min-height: 55vh; padding-top: 80px; border: 1px solid #ccc;">
    <button type="button" class="btn btn-primary position-relative">
        Inbox
        <span class="badge bg-danger {{input1}} {{input2}} {{input3}} {{input4}}">
            99+
        </span>
    </button>
</div>`,
            inputs: [
                                { placeholder: 'position-absolute', answer: 'position-absolute' },
                                { placeholder: 'top-0', answer: 'top-0' },
                                { placeholder: 'start-100', answer: 'start-100' },
                                { placeholder: 'translate-middle', answer: 'translate-middle' }
            ],
                        preview: '<div class="container-fluid text-center" style="min-height: 55vh; padding-top: 80px; border: 1px solid #ccc;"><button type="button" class="btn btn-primary position-relative">Inbox <span class="badge bg-danger {{class1}} {{class2}} {{class3}} {{class4}}">99+</span></button></div>',
            image: './images/no-image.png',
                        url: 'https://getbootstrap.com/docs/5.3/components/badges/#positioned',
                        pageTitle: 'Badges - Positioned',
                        pageLink: 'https://getbootstrap.com/docs/5.3/components/badges/#positioned',
                        cssRule: `.position-absolute { position: absolute !important; }`
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./chapter1-level.js"></script>
</body>
</html>
