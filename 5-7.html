<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Builder - 關卡 5-7</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.8/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./styles.css">
    <link rel="stylesheet" href="./chapter1-level.css">
</head>
<body>
    <div id="app"></div>
    <script>
        window.levelConfig = {
            id: '5-7',
            title: '輸入群組',
            description: '製作商品數量增減器 (- 1 +)。',
            hint: '使用 <code>input-group</code> 包裹按鈕和輸入框，讓它們排列在同一行並緊密連接。',
            htmlTemplate: `<div class="container">
  <div class="{{input1}}">
    <button class="btn btn-outline-secondary" type="button">-</button>
    <input type="text" class="form-control text-center" value="1">
    <button class="btn btn-outline-secondary" type="button">+</button>
  </div>
</div>`,
            inputs: [{ placeholder: 'input-group', answer: 'input-group' }],
            preview: '<div class="container"><div class="{{class1}}"><button class="btn btn-outline-secondary" type="button">-</button><input type="text" class="form-control text-center" value="1"><button class="btn btn-outline-secondary" type="button">+</button></div></div>',
            image: './images/no-image.png',
            url: 'https://getbootstrap.com/docs/5.3/forms/input-group/',
            pageTitle: 'Forms - Input group',
            pageLink: 'https://getbootstrap.com/docs/5.3/forms/input-group/',
            cssRule: `.input-group {
  position: relative;
  display: flex;
  flex-wrap: wrap;
  align-items: stretch;
  width: 100%;
}`
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./chapter1-level.js"></script>
</body>
</html>
