<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Builder - 關卡 5-9</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.8/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./styles.css">
    <link rel="stylesheet" href="./chapter1-level.css">
</head>
<body>
    <div id="app"></div>
    <script>
        window.levelConfig = {
            id: '5-9',
            title: '驗證準備',
            description: '表單驗證步驟 1：為 form 標籤添加 needs-validation 類別。',
            hint: '這是 Bootstrap 啟動自定義驗證樣式的標記類別。',
            htmlTemplate: `<div class="container">
  <form class="{{input1}}">
    <!-- 表單內容 -->
  </form>
</div>`,
            inputs: [{ placeholder: 'needs-validation', answer: 'needs-validation' }],
            preview: '<div class="container"><form class="{{class1}} p-3 border rounded">表單內容區域</form></div>',
            image: './images/no-image.png',
            url: 'https://getbootstrap.com/docs/5.3/forms/validation/',
            pageTitle: 'Forms - Validation',
            pageLink: 'https://getbootstrap.com/docs/5.3/forms/validation/',
            cssRule: '/* .needs-validation is a marker class */'
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./chapter1-level.js"></script>
</body>
</html>
