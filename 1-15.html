<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Builder - 關卡 1-15</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.8/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./styles.css">
    <link rel="stylesheet" href="./chapter1-level.css">
</head>
<body>
    <div id="app"></div>
    <script>
        window.levelConfig = {
            id: '1-15',
            title: '巢狀網格',
            description: '在欄位中可以再放入一個 row，實現更細緻的佈局。請在右側欄位中放入兩個等寬的子欄位。',
            hint: '外層使用 <code>.col-4</code> 和 <code>.col-8</code>。在 <code>.col-8</code> 內部再使用 <code>.row</code> 包裹兩個 <code>.col-6</code>。',
            htmlTemplate: `<div class="container">
  <div class="row">
    <div class="{{input1}}"><div class="bg-secondary text-white p-3">側邊欄</div></div>
    <div class="{{input2}}">
      <div class="row">
        <div class="{{input3}}"><div class="bg-primary text-white p-3">子欄位 A</div></div>
        <div class="{{input3}}"><div class="bg-primary text-white p-3">子欄位 B</div></div>
      </div>
    </div>
  </div>
</div>`,
            inputs: [
                { placeholder: '', answer: 'col-4' },
                { placeholder: '', answer: 'col-8' },
                { placeholder: '', answer: 'col-6' }
            ],
            preview: '<div class="container"><div class="row"><div class="{{class1}}"><div class="bg-secondary text-white p-3">側邊欄</div></div><div class="{{class2}}"><div class="row"><div class="{{class3}}"><div class="bg-primary text-white p-3">子欄位 A</div></div><div class="{{class3}}"><div class="bg-primary text-white p-3">子欄位 B</div></div></div></div></div></div>',
            image: './images/1-15.png',
            url: 'https://kpmc.com.tw/program/',
            pageTitle: 'Grid System - 巢狀網格',
            pageLink: 'https://getbootstrap.com/docs/5.3/layout/grid/#nesting',
            cssRule: `.row {
  --bs-gutter-x: 1.5rem;
  --bs-gutter-y: 0;
  display: flex;
  flex-wrap: wrap;
  margin-top: calc(-1 * var(--bs-gutter-y));
  margin-right: calc(-0.5 * var(--bs-gutter-x));
  margin-left: calc(-0.5 * var(--bs-gutter-x));
}`
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./chapter1-level.js"></script>
</body>
</html>
