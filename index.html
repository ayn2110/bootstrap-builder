<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Builder - 關卡 1-1</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.8/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./styles.css">
    <link rel="stylesheet" href="./chapter1-level.css">
</head>
<body>
    <div id="app"></div>
    <script>
        window.levelConfig = {
            id: '1-1',
            title: '容器邊界',
            description: '將內容放置於一個標準的響應式容器中，使其在頁面兩側保留適當的邊距。',
            hint: '使用 <code>.container</code> 類別來創建一個響應式固定寬度的容器。',
            htmlTemplate: `<div class="{{input1}}">
  <p>這是容器內的內容</p>
</div>`,
            inputs: [{ placeholder: '', answer: 'container' }],
            preview: '<div class="{{class1}}" style="background: #e9ecef; padding: 20px; border-radius: 5px;">這是容器內的內容</div>',
            image: './images/1-1.png',
            url: 'https://www.camacafe.com/New/',
            pageTitle: 'Containers - 容器組件',
            pageLink: 'https://getbootstrap.com/docs/5.3/layout/containers/',
            cssRule: `.container {
  --bs-gutter-x: 1.5rem;
  width: 100%;
  padding-right: calc(var(--bs-gutter-x) * 0.5);
  padding-left: calc(var(--bs-gutter-x) * 0.5);
  margin-right: auto;
  margin-left: auto;
}
@media (min-width: 1400px) {
  .container, .container-lg, .container-md, .container-sm, .container-xl, .container-xxl {
    max-width: 1320px;
  }
}`
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./chapter1-level.js"></script>
</body>
</html>
