<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Builder - 關卡 1-4</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.8/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./styles.css">
    <link rel="stylesheet" href="./chapter1-level.css">
</head>
<body>
    <div id="app"></div>
    <script>
        window.levelConfig = {
            id: '1-4',
            title: '自動填充',
            description: '將一個元件放入 row 中,讓它自動佔滿所有可用空間 (單一區塊)。',
            hint: '使用 <code>.col</code> 類別讓元素自動填充可用空間。',
            htmlTemplate: `<div class="container">
  <div class="row">
    <div class="{{input1}}">產品卡片</div>
  </div>
</div>`,
            inputs: [{ placeholder: '', answer: 'col' }],
            preview: '<div class="container"><div class="row"><div class="{{class1}} preview-element">產品卡片</div></div></div>',
            image: './images/1-4.png',
            url: 'https://www.starbucks.com.tw/home/index.jspx',
            pageTitle: 'Columns - 自動欄位',
            pageLink: 'https://getbootstrap.com/docs/5.3/layout/columns/#auto-layout-columns',
            cssRule: `.col {
  flex: 1 0 0%;
}`
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./chapter1-level.js"></script>
</body>
</html>
