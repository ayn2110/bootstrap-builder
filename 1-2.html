<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Builder - 關卡 1-2</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.8/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./styles.css">
    <link rel="stylesheet" href="./chapter1-level.css">
</head>
<body>
    <div id="app"></div>
    <script>
        window.levelConfig = {
            id: '1-2',
            title: '全寬內容',
            description: '將橫幅廣告 (Banner) 延伸至螢幕兩側邊緣,實現滿版效果。',
            hint: '使用 <code>.container-fluid</code> 類別來創建一個全寬容器。',
            htmlTemplate: `<div class="{{input1}}">
  <div class="banner">橫幅廣告</div>
</div>`,
            inputs: [{ placeholder: '', answer: 'container-fluid' }],
            preview: '<div class="{{class1}}" style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 40px; text-align: center; font-size: 1.5em;">橫幅廣告</div>',
            image: './images/1-2.png',
            url: 'https://www.nintendo.com/tw/switch2/index.html',
            pageTitle: 'Containers - 流體容器',
            pageLink: 'https://getbootstrap.com/docs/5.3/layout/containers/#fluid-containers',
            cssRule: `.container-fluid {
  --bs-gutter-x: 1.5rem;
  width: 100%;
  padding-right: calc(var(--bs-gutter-x) * 0.5);
  padding-left: calc(var(--bs-gutter-x) * 0.5);
  margin-right: auto;
  margin-left: auto;
}`
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./chapter1-level.js"></script>
</body>
</html>
