<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Builder - 關卡 5-1</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.8/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./styles.css">
    <link rel="stylesheet" href="./chapter1-level.css">
</head>
<body>
    <div id="app"></div>
    <script>
        window.levelConfig = {
            id: '5-1',
            title: '表單基礎',
            description: '了解原生 HTML 表單結構，使用 form 標籤包裹輸入元件。',
            hint: '使用 <code>form</code> 標籤包裹內容，並包含 <code>input</code> 和 <code>button</code>。',
            htmlTemplate: `<div class="container">
  <{{input1}}>
    <label>Email:</label>
    <input type="email">
    <button type="submit">送出</button>
  </{{input1}}>
</div>`,
            inputs: [{ placeholder: 'form', answer: 'form' }],
            preview: '<div class="container"><form><label>Email:</label> <input type="email"> <button type="submit">送出</button></form></div>',
            image: './images/no-image.png',
            url: 'https://developer.mozilla.org/zh-TW/docs/Web/HTML/Element/form',
            pageTitle: 'HTML Forms',
            pageLink: 'https://developer.mozilla.org/zh-TW/docs/Web/HTML/Element/form',
            cssRule: `form {
  display: block;
  margin-top: 0em;
}`
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./chapter1-level.js"></script>
</body>
</html>
