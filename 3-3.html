<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Builder - 關卡 3-3</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.8/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./styles.css">
    <link rel="stylesheet" href="./chapter1-level.css">
</head>
<body>
    <div id="app"></div>
    <script>
        window.levelConfig = {
            id: '3-3',
            title: '欄位位移',
            description: '將一個佔 6 欄的表單,向右側移動 3 欄的距離,使其在容器中置中。',
            hint: '使用 <code>.offset-3</code> 來向右偏移 3 欄。',
            htmlTemplate: `<div class="container">
  <div class="row">
    <div class="col-6 {{input1}}">登入表單</div>
  </div>
</div>`,
            inputs: [{ placeholder: 'offset-3', answer: 'offset-3' }],
            preview: '<div class="container"><div class="row"><div class="col-6 {{class1}} preview-element">登入表單</div></div></div>',
            image: './images/no-image.png',
            url: 'https://getbootstrap.com/docs/5.3/layout/columns/',
            pageTitle: 'Columns - 欄位位移',
            pageLink: 'https://getbootstrap.com/docs/5.3/layout/columns/#offsetting',
            cssRule: `.offset-3 {
  margin-left: 25%;
}`
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./chapter1-level.js"></script>
</body>
</html>
