<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Builder - 關卡 5-5</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.8/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./styles.css">
    <link rel="stylesheet" href="./chapter1-level.css">
</head>
<body>
    <div id="app"></div>
    <script>
        window.levelConfig = {
            id: '5-5',
            title: '下拉選單',
            description: '美化 Select 元素並設定禁用狀態。',
            hint: '使用 <code>form-select</code> 類別。若要禁用選項，請在 option 上加上 <code>disabled</code>。',
            htmlTemplate: `<div class="container">
  <select class="{{input1}}" aria-label="Default select example">
    <option selected>Open this select menu</option>
    <option value="1">One</option>
    <option value="2">Two</option>
    <option value="3" {{input2}}>Three (Disabled)</option>
  </select>
</div>`,
            inputs: [
                { placeholder: 'form-select', answer: 'form-select' },
                { placeholder: 'disabled', answer: 'disabled' }
            ],
            preview: '<div class="container"><select class="{{class1}}" aria-label="Default select example"><option selected>Open this select menu</option><option value="1">One</option><option value="2">Two</option><option value="3" {{class2}}>Three (Disabled)</option></select></div>',
            image: './images/no-image.png',
            url: 'https://getbootstrap.com/docs/5.3/forms/select/',
            pageTitle: 'Forms - Select',
            pageLink: 'https://getbootstrap.com/docs/5.3/forms/select/',
            cssRule: `.form-select {
  display: block;
  width: 100%;
  padding: 0.375rem 2.25rem 0.375rem 0.75rem;
  -moz-padding-start: calc(0.75rem - 3px);
  font-size: 1rem;
  font-weight: 400;
  line-height: 1.5;
  color: var(--bs-body-color);
  background-color: var(--bs-body-bg);
  border: var(--bs-border-width) solid var(--bs-border-color);
  border-radius: var(--bs-border-radius);
}`
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./chapter1-level.js"></script>
</body>
</html>
