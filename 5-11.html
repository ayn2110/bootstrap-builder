<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Builder - 關卡 5-11</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.8/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./styles.css">
    <link rel="stylesheet" href="./chapter1-level.css">
</head>
<body>
    <div id="app"></div>
    <script>
        window.levelConfig = {
            id: '5-11',
            title: '必填欄位',
            description: '表單驗證步驟 3：在 input 上添加 required 屬性，標記此欄位為必填。',
            hint: '這也是一個布林屬性。',
            htmlTemplate: `<div class="container">
  <form class="needs-validation" novalidate>
    <label for="user-name" class="form-label">姓名</label>
    <input type="text" class="form-control" id="user-name" {{input1}}>
  </form>
</div>`,
            inputs: [{ placeholder: 'required', answer: 'required' }],
            preview: '<div class="container"><form class="needs-validation" novalidate><label for="v1" class="form-label">姓名</label><input type="text" class="form-control" id="v1" {{class1}}></form></div>',
            image: './images/no-image.png',
            url: 'https://developer.mozilla.org/zh-TW/docs/Web/HTML/Attributes/required',
            pageTitle: 'HTML Attribute - Required',
            pageLink: 'https://developer.mozilla.org/zh-TW/docs/Web/HTML/Attributes/required',
            cssRule: '/* :required pseudo-class */'
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./chapter1-level.js"></script>
</body>
</html>
